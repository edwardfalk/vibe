name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    # A whole run takes about 2 minutes; a hang fails here instead of
    # holding the runner for GitHub's 6-hour default
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Unit tests
        run: pnpm run test:unit

      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

      # Downloading and extracting the browser once hung for 50 minutes (PR #87)
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browsers
        # A no-op on a cache hit. No --with-deps: the runner image already has
        # Chrome's libraries, and apt's slow mirror timed this step out
        # fetching fonts the game never uses. Rerun the job if this times out
        timeout-minutes: 10
        run: pnpm exec playwright install chromium

      - name: E2E tests
        run: pnpm run test:e2e
