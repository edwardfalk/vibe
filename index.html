<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vibe - Geometric Space Shooter</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/addons/p5.sound.min.js"></script>
    <style>
      body {
        margin: 0;
        padding: 0;
        background: #000;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        font-family: 'Courier New', monospace;
      }

      #gameContainer {
        border: 2px solid #333;
      }

      #ui {
        position: absolute;
        top: 20px;
        left: 20px;
        color: #fff;
        font-size: 16px;
        z-index: 100;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="ui">
      <div id="score">Score: 0</div>
      <div id="health">Health: 100</div>
      <div id="level">Level: 1</div>
      <div style="margin-top: 10px; font-size: 12px">
        <div id="soundStatus">🔇 Click or press M to enable sound</div>
        <div>💥 WASD to move, Mouse to aim & shoot</div>
        <div>💨 Press Space to dash</div>
        <div>⏸️ Press P to pause/resume</div>
      </div>
    </div>

    <!-- Single module entrypoint; GameLoop imports all dependencies -->
    <script type="module" src="js/GameLoop.js"></script>
  </body>
</html>
